version: '3.9'
services:
    club:
        build: .
        container_name: clubmaster
        restart: always
        env_file: .env
        command: npm run dev
        volumes:
            - .:/app
            - /app/node_modules
        ports:
            - "4100:4000"
        networks:
            - club_network
        depends_on:
            - club_database

    club_database:
        image: "mongo"
        container_name: club_database
        ports:
            - "27017:27017"
        volumes:
            - ./mongodb:/data/db
        networks:
            - club_network

volumes:
    mongodb:


networks:
    club_network:
        driver: bridge
